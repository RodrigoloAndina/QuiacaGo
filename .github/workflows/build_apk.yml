name: Validar y compilar APK beta de QuiacaGo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Pruebas y APK beta Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar Conductor Beta
        run: flutter build apk --debug --flavor conductorBeta --target lib/main.dart

      - name: Compilar Pasajero Beta
        run: flutter build apk --debug --flavor pasajeroBeta --target lib/main_pasajero.dart

      - name: Subir APK de QuiacaGo como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: QuiacaGo-APKs-Beta
          path: build/app/outputs/flutter-apk/*beta-debug.apk
          if-no-files-found: error
