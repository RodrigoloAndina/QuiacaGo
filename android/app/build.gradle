plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def signingProperties = new Properties()
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.quiacago.quiaca_go_conductor"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    flavorDimensions += ["quiacagoApp", "quiacagoEnvironment"]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.quiacago.quiaca_go_conductor"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (signingProperties['storeFile']) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    productFlavors {
        conductor {
            dimension "quiacagoApp"
            applicationId "com.quiacago.conductor"
        }
        pasajero {
            dimension "quiacagoApp"
            applicationId "com.quiacago.pasajero"
        }
        beta {
            dimension "quiacagoEnvironment"
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
        }
        production {
            dimension "quiacagoEnvironment"
        }
    }

    buildTypes {
        release {
            if (!signingProperties['storeFile'] && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                throw new GradleException('Falta android/key.properties: no se permite firmar una versión de producción con la clave debug.')
            }
            if (signingProperties['storeFile']) signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}
