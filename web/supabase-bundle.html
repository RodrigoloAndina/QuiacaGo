<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuiacaGo · SQL Supabase</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:1100px;margin:auto;padding:24px}button{background:#22c55e;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#334155;color:white}textarea{width:100%;min-height:65vh;background:#020617;color:#dbeafe;border:1px solid #334155;border-radius:8px;padding:14px;font:12px ui-monospace,monospace;box-sizing:border-box}.warning{background:#422006;border:1px solid #f59e0b;padding:12px;border-radius:8px}select{padding:10px;border-radius:8px;min-width:340px}</style></head><body><h1>QuiacaGo · SQL para Supabase</h1><div class="warning">Aplicá los archivos en el orden indicado. Probá primero en un proyecto beta y revisá el resultado antes de usar producción. No pegues contraseñas ni claves secretas en este editor.</div><p><select id="file"></select><button id="copy">Copiar SQL visible</button><button class="secondary" id="all">Cargar todo en una sola caja</button></p><textarea id="sql" readonly>Cargando…</textarea><script>
const files=["migrate_existing.sql","registration_flow.sql","driver_messages_and_phone_verification.sql","admin_driver_notifications.sql","ratings.sql","tariff_settings.sql","app_release_control.sql","payment_disputes.sql","compatibility_patch.sql","production_functionality.sql","complete_trip_flow.sql","cancellation_management.sql","production_hardening.sql","operations_and_privacy.sql","pilot_integration.sql","verify_v1_backend.sql"];const requested = new URLSearchParams(location.search).get('file'); const select=document.querySelector('#file'),box=document.querySelector('#sql'),cache={};files.forEach((f,i)=>{const o=document.createElement('option');o.value=f;o.textContent=`${i+1}. ${f}`;select.append(o)});async function load(f){if(!cache[f]){const r=await fetch('/supabase/'+f);if(!r.ok)throw Error('No se pudo cargar '+f);cache[f]=await r.text()}return cache[f]}async function show(){box.value=await load(select.value)}select.onchange=show;document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(box.value);alert('SQL copiado')};document.querySelector('#all').onclick=async()=>{box.value=(await Promise.all(files.map(load))).map((x,i)=>`-- ===== ${files[i]} =====\n${x}`).join('\n\n')};if(files.includes(requested)) select.value=requested;show();</script></body></html>
